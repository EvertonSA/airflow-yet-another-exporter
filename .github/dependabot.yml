# A professional Dependabot configuration following GitHub best practices
version: 2
updates:
  # ----------------------------------------
  # Golang Ecosystem (Exporter core)
  # ----------------------------------------
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "EvertonSA"
    labels:
      - "dependencies"
      - "golang"
    commit-message:
      prefix: "chore(deps):"

  # ----------------------------------------
  # Python Ecosystem (Using UV native support)
  # ----------------------------------------
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "EvertonSA"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps):"

  # ----------------------------------------
  # Docker Ecosystem (Base images)
  # ----------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    reviewers:
      - "EvertonSA"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps):"

  # ----------------------------------------
  # GitHub Actions Ecosystem (CI/CD workflows)
  # ----------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    reviewers:
      - "EvertonSA"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps):"
