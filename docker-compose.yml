version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_password
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:3.1.5
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow_password@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow_password@postgres/airflow
      - AIRFLOW__CORE__AUTH_MANAGER=airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      - AIRFLOW__API__AUTH_BACKENDS=airflow.providers.fab.auth_manager.api.auth.backend.basic_auth
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-fab>=3.1.0
    volumes:
      - /home/everton/github/airflow/providers/grafana:/opt/grafana-provider:ro
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  airflow-api-server:
    image: apache/airflow:3.1.5
    environment: &airflow-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_password@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow_password@postgres/airflow
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__API__AUTH_BACKENDS: airflow.providers.fab.auth_manager.api.auth.backend.basic_auth
      AIRFLOW__API_AUTH__JWT_SECRET: "super-secret-jwt-token-key-change-me"
      AIRFLOW__API__AUTH_JWT_SECRET: "super-secret-jwt-token-key-change-me"
      AIRFLOW__SECRET_KEY: "super-secret-key-change-me"
      AIRFLOW__WEBSERVER__SECRET_KEY: "super-secret-key-change-me"
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-fab>=3.1.0
      AIRFLOW__LOGGING__REMOTE_LOGGING: 'true'
      AIRFLOW__LOGGING__LOGGING_CONFIG_CLASS: 'custom_logging_config.LOGGING_CONFIG'
      PYTHONPATH: '/opt/airflow/config:/opt/grafana-provider/src'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - /home/everton/github/airflow/providers/grafana:/opt/grafana-provider:ro
      - ./config:/opt/airflow/config:ro
    command: airflow api-server
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    image: apache/airflow:3.1.5
    environment: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags
      - /home/everton/github/airflow/providers/grafana:/opt/grafana-provider:ro
      - ./config:/opt/airflow/config:ro
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    image: apache/airflow:3.1.5
    environment: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags
      - /home/everton/github/airflow/providers/grafana:/opt/grafana-provider:ro
      - ./config:/opt/airflow/config:ro
    command: airflow triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    image: apache/airflow:3.1.5
    environment: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags
      - /home/everton/github/airflow/providers/grafana:/opt/grafana-provider:ro
      - ./config:/opt/airflow/config:ro
    command: airflow dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    image: apache/airflow:3.1.5
    environment:
      <<: *airflow-env
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution
    volumes:
      - ./dags:/opt/airflow/dags
      - /home/everton/github/airflow/providers/grafana:/opt/grafana-provider:ro
      - ./config:/opt/airflow/config:ro
    command: airflow celery worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  exporter:
    build: .
    environment:
      - AIRFLOW_EXPORTER_DATABASE_CONNECTION_STRING=postgres://airflow:airflow_password@postgres:5432/airflow?sslmode=disable
      - AIRFLOW_EXPORTER_LOG_LEVEL=debug
      - AIRFLOW_EXPORTER_OTEL_ENDPOINT=alloy:4317
      - AIRFLOW_EXPORTER_SCRAPE_INTERVAL=30s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-api-server:
        condition: service_started
    networks:
      - default

  alloy:
    image: grafana/alloy:latest
    command: [
      "run",
      "--server.http.listen-addr=0.0.0.0:12345",
      "/etc/alloy/config.alloy",
    ]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy
    ports:
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"
    depends_on:
      prometheus:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-remote-write-receiver' # Important: Enable remote write for Alloy
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./ops:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

networks:
  default:
    driver: bridge
